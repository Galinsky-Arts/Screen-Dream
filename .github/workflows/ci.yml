name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Syntax + end-to-end smoke (mock providers, Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sd
          POSTGRES_PASSWORD: sd
          POSTGRES_DB: sd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sd" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://sd:sd@localhost:5432/sd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm test
