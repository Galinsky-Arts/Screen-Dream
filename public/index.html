<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ScreenDream</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f2a93b'/%3E%3Ctext x='16' y='21.5' font-size='14' font-weight='700' text-anchor='middle' fill='%23170f02' font-family='Arial'%3ESD%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="login" class="login hidden">
    <form id="loginForm" class="login-card">
      <div class="brand"><span class="logo">SD</span><span>ScreenDream</span></div>
      <label class="field"><span>Password</span><input type="password" id="loginPassword" autocomplete="current-password" required /></label>
      <button class="btn primary wide" type="submit">Sign in</button>
      <p id="loginError" class="error-text"></p>
    </form>
  </div>
  <div id="app" class="shell hidden">
    <aside class="sidebar">
      <div class="brand"><span class="logo">SD</span><span>ScreenDream</span></div>
      <nav class="nav">
        <a href="#/" data-nav="films"><span class="ico">▶</span>Films</a>
        <a href="#/new" data-nav="new"><span class="ico">＋</span>New film</a>
        <a href="#/consent" data-nav="consent"><span class="ico">◉</span>Your likeness</a>
        <a href="#/rights" data-nav="rights"><span class="ico">§</span>Usage rights</a>
        <a href="#/settings" data-nav="settings"><span class="ico">⚙</span>Settings</a>
      </nav>
      <div class="side-foot muted small">Concept to finished film, every step AI, every step Auto or Manual.</div>
    </aside>
    <main id="view" class="view"></main>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
